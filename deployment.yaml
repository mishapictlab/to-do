apiVersion: apps/v1
kind: Deployment

metadata:
  name: to-do-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: to-do

  template:
    metadata:
      labels:
        app: to-do

    spec:
      containers:
        - name: to-do-container
          image: to-do:2.0
          imagePullPolicy: Never

          ports:
            - containerPort: 3000